name: CI

on:
  push:
  pull_request:
    branches:
      - 'main'
      - 'master'

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libfontconfig1 libxkbcommon0

      - name: Lint with Ruff
        run: uv run ruff check .
      
      - name: Run tests
        run: uv run pytest -v --cov=nmanga --cov-config=./.coveragerc --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=pytest.xml tests
      
      - name: Run coverage report
        run: uv run coverage report

      - name: Attach coverage report to the job summary
        if: always()
        run: |
          {
            echo "## Coverage report"
            echo
            echo "**Total coverage: $(uv run coverage report --format=total)%**"
            echo
            echo "<details><summary>Per-file coverage</summary>"
            echo
            uv run coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1
        if: github.event_name == 'pull_request'
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          default-branch: master
          title: Coverage Report
          badge-title: Coverage
          xml-skip-covered: true
