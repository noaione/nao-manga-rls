[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmanga"
description = "A collection of CLI function to process a manga releases."
readme = "README.md"
dynamic = ["version"]
license = {text = "MIT"}
requires-python = ">=3.13,<3.15"
authors = [{name = "noaione", email = "noaione@n4o.xyz"}]
keywords = ["manga", "colorlevel", "spreads", "auto-splitting", "processing", "cbz", "comic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "rich==15.0.0",
    "inquirer==3.4.1",
    "click==8.5.0",
    "ftfy==6.3.1",
    "pydantic==2.13.5",
    "typing-extensions==4.16.0",
    "Pillow==12.3.0",
    "lxml==6.1.3",
    "unrar2-cffi==0.5.0",
    "py7zr==1.1.3",
    "defusedxml==0.7.1",
    "rich-click==1.9.9",
    "cykooz.resizer==4.0.1",
    "wand==0.7.2",
    "click-pwsh==0.9.7",
    "beautifulsoup4>=4.15.0",
    "pikepdf==10.13.0.post1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff>=0.16.7",
]
autostuff = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
denoiser = [
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnxruntime==1.30.0; sys_platform == 'darwin'",
    "onnxruntime-ep-nv-tensorrt-rtx-cu13==0.4.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxruntime-gpu==1.30.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxscript>=0.7.2",
    "tensorrt-cu13==10.16.1.11; (sys_platform == 'linux' or sys_platform == 'win32') and python_version <= '3.13'",
    "torch>=2.14.0",
    "einops>=0.8.2",
    "resselt>=1.4.1",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-applicationmodel>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-management-deployment>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-system>=3.2.1; sys_platform == 'win32'",
]
vapoursynth = [
    "vapoursynth==79"
]
epub-render = ["playwright>=1.62.0"]

[tool.setuptools.dynamic]
version = {attr = "nmanga._metadata.__version__"}

[project.urls]
"Bug Reports" = "https://github.com/noaione/nao-manga-rls/issues"
"Source" = "https://github.com/noaione/nao-manga-rls"

[project.scripts]
nmanga = "nmanga.cmd:main"

[tool.setuptools]
packages = ["nmanga", "nmanga.cli", "nmanga.term", "nmanga.templates", "nmanga.orchestrator", "nmanga.orchestrator.actions"]

[tool.uv]
override-dependencies = ["onnxruntime-windowsml; sys_platform == 'never'"]
dependency-metadata = [
    { name = "tensorrt-cu13-libs", version = "10.16.1.11", requires-dist = [] },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" }
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[tool.ruff]
line-length = 120
extend-exclude = [
    "env",
    "venv",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    "**/Lib/**",
    "dist",
    "build",
    "_templates",
    "tools",
]
target-version = "py310"
src = ["nmanga", "tests", "ci"]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "S",
    "B",
    "T",
    "Q",
    "D",
    "RUF",
    "COM",
    "PTH",
    "ASYNC"
]
ignore = [
    "whitespace-before-punctuation",
    "undefined-local-with-import-star-usage",
    "undefined-local-with-import-star",
    "forward-annotation-syntax-error",
    "non-lowercase-variable-in-function",
    "missing-trailing-comma",
    "missing-trailing-period",  # first line should be period, most of my docstring will be LICENSE header so no thanks
    "blank-line-after-function",
    "non-imperative-mood",
    "CPY",
]
preview = true
extend-ignore = ["D", "subprocess-without-shell-equals-true", "suspicious-subprocess-import", "print"] # D -> Docstring missing for public function or method

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.isort]
combine-as-imports = false
split-on-trailing-comma = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["tests", "nmanga"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undefined-local-with-import-star", "missing-required-import", "missing-blank-line-after-summary"]
"tests/*.py" = ["assert", "missing-required-import", "D"]  # assert statement used in pytest
"pipelines/*" = ["T", "I", "subprocess-without-shell-equals-true", "D"]
"tools/*.py" = ["undocumented-public-module", "print", "missing-required-import"]

[tool.pyright]
exclude = [
    ".vscode/*",
    "tests/*",
    "_templates/**/*",
    "build/**/*",
    "dist",
    ".venv",
    "venv",
    "env",
    "**/Lib/**",
    "**/node_modules/**",
    "**/__pycache__",
    "**/.*"
]
