[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmanga"
description = "A collection of CLI function to process a manga releases."
readme = "README.md"
dynamic = ["version"]
license = "MIT"
requires-python = ">=3.13,<3.15"
authors = [{name = "noaione", email = "noaione@n4o.xyz"}]
keywords = ["manga", "colorlevel", "spreads", "auto-splitting", "processing", "cbz", "comic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "rich==15.0.0",
    "inquirer==3.4.1",
    "click==8.5.1",
    "ftfy==6.3.1",
    "pydantic==2.14.3",
    "typing-extensions==4.16.0",
    "Pillow==13.0.0",
    "lxml==6.1.3",
    "unrar2-cffi==0.5.0",
    "py7zr==1.1.4",
    "defusedxml==0.7.1",
    "rich-click==1.9.9",
    "cykooz.resizer==4.0.1",
    "wand==0.7.2",
    "click-pwsh==0.9.7",
    "beautifulsoup4>=4.15.0",
    "pikepdf==10.17.0",
    "natsort==8.4.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "scipy-stubs==1.18.1.1",
    "types-defusedxml==0.7.0.20260504"
]
gui = ["PySide6>=6.7"]
denoiser = [
    # Vendor neutral part of the machine learning stack: the ONNX tooling and torch, but no
    # execution provider and no torch wheel flavour. Pair it with one of the `denoiser-*` extras.
    "torch>=2.15.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "einops>=0.8.2",
    "resselt>=1.4.1",
    "safetensors>=0.5.3,<0.6",
    # `torch infer --compile` needs Triton; the Windows wheel of it is not a torch dependency.
    "triton==3.9.0; sys_platform == 'linux'",
    "triton-windows==3.9.0.post30; sys_platform == 'win32'",
    "windowsml==2.5.96; sys_platform == 'win32'",
]
denoiser-ort = [
    # The stock ONNX Runtime wheel: CoreML on macOS, a CPU provider everywhere else. This is the
    # runtime the plugin EP extras (denoiser-intel, denoiser-mlx) load into.
    "onnxruntime==1.31.1",
]
denoiser-nvidia = [
    # CUDA, TensorRT and TensorRT RTX. This is the only extra that pulls a CUDA build of torch,
    # and it replaces the stock runtime instead of extending it.
    "torch>=2.15.0",
    "onnxruntime-gpu==1.31.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxruntime-ep-nv-tensorrt-rtx-cu13==0.5.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "tensorrt-cu13==10.16.1.11; (sys_platform == 'linux' or sys_platform == 'win32') and python_version <= '3.13'",
]
denoiser-intel = [
    # OpenVINO plugin EP. It loads into either runtime, so it can be combined with denoiser-ort or
    # denoiser-nvidia. The plugin only ships x86_64 wheels.
    "onnxruntime-ep-openvino==1.8.1; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
denoiser-wgpu = [
    # WebGPU which use Vulkan at the backend for most of the time
    "onnxruntime-ep-webgpu==0.5.0",
]
denoiser-mlx = [
    # Apple Silicon MLX plugin EP (macOS 14+) on top of denoiser-ort.
    "onnxruntime-ep-mlx==0.31.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
vapoursynth = [
    "vapoursynth==82",
    "vapoursynth-imageseqs==0.4.2",
    "vapoursynth-nimages==0.2.1",
    "vsrepo"
]
epub-render = ["playwright==1.64.1"]

[tool.setuptools.dynamic]
version = {attr = "nmanga._metadata.__version__"}

[project.urls]
"Bug Reports" = "https://github.com/noaione/nao-manga-rls/issues"
"Source" = "https://github.com/noaione/nao-manga-rls"

[project.scripts]
nmanga = "nmanga.cmd:main"
nmanga-gui = "nmanga.gui:main"

[tool.setuptools]
packages = [
    "nmanga",
    "nmanga.cli",
    "nmanga.gui",
    "nmanga.ml",
    "nmanga.ml.opt_arch",
    "nmanga.term",
    "nmanga.templates",
    "nmanga.orchestrator",
    "nmanga.orchestrator.actions",
]

[tool.uv]
override-dependencies = ["onnxruntime-windowsml; sys_platform == 'never'"]
dependency-metadata = [
    { name = "tensorrt-cu13-libs", version = "10.16.1.11", requires-dist = [] },
]
# `denoiser-nvidia` swaps the ONNX Runtime distribution for the CUDA build, so it cannot be
# combined with the extras that need the stock runtime. `denoiser-intel` only adds a plugin and
# works with either of them.
conflicts = [
    [{ extra = "denoiser-nvidia" }, { extra = "denoiser-ort" }],
    [{ extra = "denoiser-nvidia" }, { extra = "denoiser-mlx" }],
]

[tool.uv.sources]
# Only the NVIDIA extra switches the torch wheel: an extra gated source has to be declared by that
# extra too. pip ignores this table, so a `pip install nmanga[denoiser,denoiser-nvidia]` gets the
# PyPI torch wheel (the CPU build on Windows) unless `--extra-index-url
# https://download.pytorch.org/whl/cu132` is added as well.
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "denoiser-nvidia" },
]
vapoursynth-nimages = { index = "serikat-pypi" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[[tool.uv.index]]
name = "serikat-pypi"
url = "https://pypi.serik.at/simple/"

[tool.ruff]
line-length = 120
extend-exclude = [
    "env",
    "venv",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    "**/Lib/**",
    "dist",
    "build",
    "_templates",
    "tools",
]
target-version = "py313"
src = ["nmanga", "tests", "ci"]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "S",
    "B",
    "T",
    "Q",
    "D",
    "RUF",
    "COM",
    "PTH",
    "ASYNC"
]
ignore = [
    "whitespace-before-punctuation",
    "undefined-local-with-import-star-usage",
    "undefined-local-with-import-star",
    "forward-annotation-syntax-error",
    "non-lowercase-variable-in-function",
    "missing-trailing-comma",
    "missing-trailing-period",  # first line should be period, most of my docstring will be LICENSE header so no thanks
    "blank-line-after-function",
    "non-imperative-mood",
    "CPY",
]
preview = true
extend-ignore = ["D", "subprocess-without-shell-equals-true", "suspicious-subprocess-import", "print"] # D -> Docstring missing for public function or method

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.isort]
combine-as-imports = false
split-on-trailing-comma = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["tests", "nmanga"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undefined-local-with-import-star", "missing-required-import", "missing-blank-line-after-summary"]
"tests/*.py" = ["assert", "missing-required-import", "D"]  # assert statement used in pytest
"pipelines/*" = ["T", "I", "subprocess-without-shell-equals-true", "D"]
"tools/*.py" = ["undocumented-public-module", "print", "missing-required-import"]

[tool.pyrefly]
project-excludes = [
    ".vscode/*",
    "tests/*",
    "_templates/**/*",
    "build/**/*",
    "dist",
    ".venv",
    "venv",
    "env",
    "**/Lib/**/*",
    "**/node_modules/**/*",
    "**/__pycache__",
    "**/.*",
]
infer-with-first-use = false
